    <title> Задача 1</title>
    <meta charset="UTF-8">
</head>

<body>
    <h1> Стихотворение </h1>
    <div class="poem">
        Мириады маленьких дел <br>
        Пьют по капле гаснущий день, <br>
        А <i>дела большие</i> сушит жажда. <br>
        Оставляя все на «потом»,<br>
        Прозреваем задним числом,<br>
        Только год <b>не повторится</b> дважды.<br>
    </div>
    <p>
        И.Тальков<br>
    </p>
</body>
